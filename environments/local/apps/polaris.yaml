apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polaris
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/OmalCooray/test-k8s-configs
      targetRevision: master
      path: charts/polaris
      helm:
        valueFiles:
          - $values/environments/local/values/polaris.yaml
    - repoURL: https://github.com/OmalCooray/test-k8s-configs
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Shared namespace for this whole subsystem (not one-app-per-namespace) —
    # these 4 apps are one cohesive feature, not independent consumers.
    # See docs/superpowers/specs/2026-09-11-iceberg-lakehouse-design.md Section 1.
    namespace: lakehouse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
