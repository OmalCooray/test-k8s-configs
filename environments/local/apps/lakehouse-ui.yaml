apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakehouse-ui
  namespace: argocd
  # NOTE: this app will show CrashLoopBackOff/Degraded until the
  # lakehouse-ui-polaris-credentials Secret is created out-of-band via
  # bootstrap/polaris-setup.sh (a later manual step, not yet written as of
  # this commit). That is expected, not a regression.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/OmalCooray/test-k8s-configs
      targetRevision: master
      path: charts/lakehouse-ui
      helm:
        valueFiles:
          - $values/environments/local/values/lakehouse-ui.yaml
    - repoURL: https://github.com/OmalCooray/test-k8s-configs
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    # Shared namespace for this whole subsystem (not one-app-per-namespace) —
    # these 4 apps are one cohesive feature, not independent consumers.
    # See docs/superpowers/specs/2026-09-11-iceberg-lakehouse-design.md Section 1.
    namespace: lakehouse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
