# Per-environment (local) overrides for metabase — production hardening.
metabase:
  replicaCount: 2

  pdb:
    create: true
    minAvailable: 1
    maxUnavailable: ""   # mutually exclusive with minAvailable

  resources:
    # Metabase idles around ~950Mi, so a 1Gi request keeps the memory-target
    # HPA permanently saturated. Size the request to the real baseline + headroom.
    requests:
      cpu: 300m
      memory: 1536Mi
    limits:
      cpu: "1"
      memory: 2560Mi

  extraEnv:
    - name: JAVA_OPTS
      value: "-Xmx2g"

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

  # spread the 2 replicas across nodes when the cluster has more than one
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: metabase
            topologyKey: kubernetes.io/hostname
