# Overrides for the upstream chart "airflow".
# The airflow chart derives resource names from the Helm release name; Argo CD
# sets that to the Application name ("airflow"), so components are already
# airflow-<component> and the ServiceMonitor below can target airflow-statsd.
airflow: {}

# ServiceMonitor for the statsd-exporter sidecar (Prometheus format on :9102).
serviceMonitor:
  enabled: true
  selectorLabels:
    component: statsd
    release: airflow
  port: statsd-scrape
  path: /metrics
  interval: 30s

# Grafana dashboards for airflow (rendered into a sidecar ConfigMap, "airflow" folder).
grafanaDashboards:
  enabled: true
