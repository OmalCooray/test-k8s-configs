# Base overrides for the upstream "polaris" chart (Apache Polaris).
# Environment-agnostic settings live here; per-env sizing is in the overlay.
#
# Persistence: relational-jdbc against polaris-postgres (see
# charts/polaris-postgres). Reuses the SAME out-of-band Secret
# ("polaris-postgres") that chart's userDatabase config uses — Polaris
# connects as the dedicated "polaris" user (POSTGRES_USER_NAME /
# POSTGRES_USER_PASSWORD keys), not the Postgres superuser. jdbcUrl is a
# separate manually-set key (not derivable from the others):
#   jdbcUrl = jdbc:postgresql://polaris-postgres:5432/polaris
#
# Realm bootstrap (creating realm POLARIS + a root principal) is NOT part of
# this chart — see bootstrap/polaris-setup.sh (Task 13), run once after this
# app is Synced/Healthy.
#
# The chart also renders a separate "polaris-mgmt" Service (port 8182) for
# Quarkus management endpoints (/q/health/live, /q/health/ready); nothing
# here controls it, it's just upstream's default management port wiring.
polaris:
  persistence:
    type: relational-jdbc
    relationalJdbc:
      secret:
        name: polaris-postgres
        username: POSTGRES_USER_NAME
        password: POSTGRES_USER_PASSWORD
        jdbcUrl: jdbcUrl

  realmContext:
    # Matches upstream's default; pinned explicitly since Task 13's bootstrap
    # script hardcodes this realm name.
    realms:
      - POLARIS

  # MinIO isn't a real AWS STS provider, so Polaris can't assume a role to
  # vend temporary credentials to clients — it needs a static credential of
  # its own to hand back for ACCESS_DELEGATION_MODE 'vended_credentials'.
  # Secret created out of band (not in git): polaris-storage-credentials,
  # keys awsAccessKeyId/awsSecretAccessKey (same MinIO root creds as
  # minio-credentials).
  storage:
    secret:
      name: polaris-storage-credentials
      awsAccessKeyId: awsAccessKeyId
      awsSecretAccessKey: awsSecretAccessKey

  # CORS for the (unofficial, dev-only) Polaris Console SPA — it calls this
  # REST API directly from the browser (Vite dev server on localhost:5173),
  # which the default Quarkus config rejects as a preflight failure. Origin
  # is scoped to that one local dev server, not a wildcard.
  advancedConfig:
    # quarkus.http.cors (no .enabled) is silently ignored on this Quarkus
    # version — renamed to quarkus.http.cors.enabled in Quarkus 3.4+.
    # Confirmed live: the old key produced a startup warning
    # ("Unrecognized configuration key") and no CORS headers were ever sent.
    quarkus.http.cors.enabled: "true"
    quarkus.http.cors.origins: "http://localhost:5173"
    quarkus.http.cors.methods: "GET,POST,PUT,DELETE,OPTIONS,HEAD"
    quarkus.http.cors.headers: "*"
    quarkus.http.cors.access-control-allow-credentials: "true"
