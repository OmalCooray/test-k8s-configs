# Base overrides for the upstream "metabase" chart (pmint93/metabase).
# Environment-agnostic. Per-env sizing/HA is in environments/<env>/values/metabase.yaml.
metabase:
  # --- Application database: external MySQL, never the default H2. ---
  database:
    type: mysql
    # Secret created out of band (plugin Phase 3 will manage this).
    existingSecret: metabase-db
    # Full JDBC connection URI (key: connectionURI) is the ONLY DB config —
    # username/password are inside it, so the chart's separate MB_DB_USER /
    # MB_DB_PASS env vars are not set (they would override and confuse Metabase).
    # The URI carries useSSL=true&trustServerCertificate=true: MySQL 9 defaults
    # to caching_sha2_password auth, which Metabase's bundled MariaDB Connector/J
    # 2.x can only complete over TLS (otherwise "RSA public key is not available").
    existingSecretConnectionURIKey: connectionURI
    # Stable key that encrypts data-source credentials Metabase stores in its DB.
    existingSecretEncryptionKeyKey: encryptionKey

  # Health probes ship enabled by default in this chart — keep them.

  # Run non-root with a read-only-friendly context.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 2000
    fsGroup: 2000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  service:
    externalPort: 80
    internalPort: 3000
