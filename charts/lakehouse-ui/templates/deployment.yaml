apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-ui
  labels:
    app.kubernetes.io/name: lakehouse-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lakehouse-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakehouse-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: lakehouse-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POLARIS_ENDPOINT
              value: {{ .Values.polaris.endpoint | quote }}
            - name: POLARIS_CATALOG
              value: {{ .Values.polaris.catalog | quote }}
            - name: POLARIS_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.polaris.credentialsSecret }}
                  key: POLARIS_CLIENT_ID
            - name: POLARIS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.polaris.credentialsSecret }}
                  key: POLARIS_CLIENT_SECRET
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
