apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakehouse-ui
  labels:
    app.kubernetes.io/name: lakehouse-ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: lakehouse-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lakehouse-ui
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
        app.kubernetes.io/managed-by: {{ .Release.Service }}
        helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: lakehouse-ui
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # DuckDB's Iceberg extension creates a "data" directory relative
          # to the process's CWD as part of a write (CREATE TABLE/INSERT)
          # — found live: a real write query 400'd with "Failed to create
          # directory \"data\": Read-only file system", since the image's
          # WORKDIR (/app) is on the read-only root filesystem. Running
          # from /tmp (already a writable emptyDir, see volumeMounts
          # below) fixes it; PYTHONPATH=/app keeps `app.main` importable
          # since it's no longer the CWD Python would otherwise resolve
          # the package from.
          workingDir: /tmp
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONPATH
              value: /app
            - name: POLARIS_ENDPOINT
              value: {{ .Values.polaris.endpoint | quote }}
            - name: POLARIS_MANAGEMENT_ENDPOINT
              value: {{ .Values.polaris.managementEndpoint | quote }}
            - name: POLARIS_CATALOG
              value: {{ .Values.polaris.catalog | quote }}
            - name: POLARIS_ROOT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.polaris.rootCredentialsSecret }}
                  key: CLIENT_ID
            - name: POLARIS_ROOT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.polaris.rootCredentialsSecret }}
                  key: CLIENT_SECRET
            - name: LAKEHOUSE_UI_DB_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: LAKEHOUSE_UI_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: LAKEHOUSE_UI_DB
            - name: LAKEHOUSE_UI_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: LAKEHOUSE_UI_USER_NAME
            - name: LAKEHOUSE_UI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret }}
                  key: LAKEHOUSE_UI_USER_PASSWORD
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is true, but DuckDB needs somewhere to
            # write extension config/cache (~/.duckdb) and spill/temp files
            # for larger queries (/tmp) — found live: the /healthz-only smoke
            # test during hardening never exercised an actual DuckDB query.
            - name: duckdb-home
              mountPath: /home/appuser/.duckdb
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: duckdb-home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
