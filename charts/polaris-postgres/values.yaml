# Base overrides for the upstream "postgres" chart (groundhog2k/postgres).
# Environment-agnostic settings live here; per-env sizing is in the overlay.
# Dedicated, single-purpose Postgres for Apache Polaris's relational-jdbc
# metastore — not shared with the mysql app. Polaris's relational-jdbc
# backend supports Postgres and H2 only, not MySQL.
postgres:
  fullnameOverride: polaris-postgres

  settings:
    # Secret with POSTGRES_PASSWORD (created out of band, not in git). The
    # same Secret also carries the userDatabase keys below, plus
    # jdbcUrl for charts/polaris/values.yaml's relationalJdbc config —
    # see the Task 10 note below.
    existingSecret: polaris-postgres
    superuserPassword:
      secretKey: POSTGRES_PASSWORD
    # Left unset deliberately: the upstream image defaults POSTGRES_USER to
    # "postgres" when no superuser.secretKey/.value is given. Fine here
    # since Polaris connects as the dedicated user below, not the superuser.

  # Creates the `polaris` database and a dedicated non-superuser `polaris`
  # user on first boot, from the same Secret above (instead of a superuser-
  # only customScripts CREATE DATABASE). /docker-entrypoint-initdb.d scripts
  # — how the chart implements userDatabase under the hood, see
  # 01-init-userdb.sh in templates/scripts.yaml — run exactly once, only
  # against an empty PGDATA, so this is safe across restarts as long as
  # PGDATA is backed by persistent storage (the not-yet-created
  # environments/local/values/polaris-postgres.yaml overlay's job).
  userDatabase:
    existingSecret: polaris-postgres
    name:
      secretKey: POSTGRES_DB
    user:
      secretKey: POSTGRES_USER_NAME
    password:
      secretKey: POSTGRES_USER_PASSWORD

  # ---------------------------------------------------------------------
  # NOTE for Task 10 (charts/polaris, not yet written): Apache Polaris's
  # relationalJdbc.secret.{username,password} config lets you point at
  # arbitrary key names in an existing secret. Point those at THIS SAME
  # polaris-postgres Secret's POSTGRES_USER_NAME / POSTGRES_USER_PASSWORD
  # keys (the dedicated "polaris" user created above) — do NOT invent
  # separate username/password keys that would just duplicate the same
  # values under different names. (Deliberately not named plain
  # POSTGRES_USER: that name already means "the superuser" by Postgres
  # image convention, and reusing it for a non-superuser user is exactly
  # the kind of ambiguity this chart is trying to get away from.)
  # Only relationalJdbc.secret.jdbcUrl needs a distinct, manually-set key
  # in this Secret (e.g. `jdbcUrl`, value
  # `jdbc:postgresql://polaris-postgres:5432/polaris`), since it isn't
  # derivable from any single existing key.
  # ---------------------------------------------------------------------

  # Identical to upstream's own default (5432) — kept as an explicit pin
  # (not a deviation) because the JDBC URL in Task 10/13
  # (jdbc:postgresql://polaris-postgres:5432/polaris) references it by
  # name and port.
  service:
    port: 5432

  # groundhog2k/postgres ships a hardened securityContext by default
  # (runAsNonRoot, readOnlyRootFilesystem, drop ALL, fsGroup 999) — keep it.
